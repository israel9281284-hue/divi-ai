```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Divi AI</title>

    <!-- Connect the design -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>Divi AI</h1>
            <p>Your Personal AI Assistant</p>
        </header>

        <main>

            <!-- Chat messages appear here -->
            <div id="chatBox" class="chat-box">

                <div class="message ai-message">
                    Hello! I'm Divi AI. How can I help you?
                </div>

            </div>

            <!-- User input -->
            <div class="input-area">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Ask Divi AI something..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </main>

    </div>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
```
